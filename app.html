<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order | HanzzZ Joki DLS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#01173d;--nav:#081120;--c:#111d33;--t:#fff;--m:#94a3b8;--a:#4dabff;--btn:#0d6efd;--ok:#22c55e;--r:#ef4444;--y:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:var(--t)}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 8%;background:var(--nav);position:sticky;top:0;z-index:99}
header a{color:#fff;text-decoration:none;font-weight:600;font-size:20px;transition:.3s}
header a:hover{color:var(--a)}
a{color:var(--a);text-decoration:none}
main{max-width:640px;margin:0 auto;padding:30px 18px 60px}
h2{margin-bottom:6px}
p{line-height:1.6;margin-top:8px}
.card{background:var(--c);border-radius:15px;padding:22px;margin-bottom:16px;border:1px solid rgba(255,255,255,.08);transition:.3s}
.card:hover{border-color:#2563eb}
label{display:block;margin:14px 0 5px;font-size:13px;color:var(--m)}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0b1426;color:#fff;font-size:15px}
input:focus,select:focus{outline:none;border-color:var(--btn)}
button{display:inline-block;padding:11px 20px;border:0;border-radius:10px;background:#1e293b;color:#fff;cursor:pointer;font-size:14px;margin:6px 6px 0 0;transition:.3s}
button:hover{transform:translateY(-2px);background:#2b3a55}
button.pri{background:var(--btn);width:100%;margin-top:18px;font-weight:600}
button.pri:hover{background:#0b5ed7}
#tabs{display:flex;flex-wrap:wrap;margin-bottom:18px}
#tabs .on{background:var(--btn)}
.m{color:var(--m)}
.b{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;background:#1e293b}
.s-DIPROSES,.s-MENUNGGU_VERIFIKASI{background:var(--y);color:#1c1300}
.s-SELESAI{background:var(--ok);color:#052e12}
.s-DIBATALKAN,.s-PEMBAYARAN_DITOLAK{background:var(--r)}
#msg{display:none;padding:12px;border-radius:10px;margin-bottom:16px}
#msg.err{background:#4a1d1d}
#msg.ok{background:#14391f}
img.qr{width:100%;max-width:280px;display:block;margin:14px auto;border-radius:12px;background:#fff}
</style>
</head>
<body>
<header><a href="index.html">HanzzZ.</a><span id="who" class="m"></span></header>
<main>
<div id="msg"></div>

<section id="auth" hidden>
 <div class="card">
  <h2 id="ttl">Masuk</h2>
  <label>Nomor WhatsApp</label><input id="u" autocomplete="username" placeholder="08xxxxxxxxxx">
  <label>Password</label><input id="p" type="password" autocomplete="current-password">
  <button class="pri" id="go" onclick="auth()">Masuk</button>
  <p class="m" style="font-size:13px;text-align:center">Lupa password? Hubungi admin lewat WhatsApp.</p>
  <p class="m" style="text-align:center"><a href="#" onclick="mode();return false" id="sw">Belum punya akun? Daftar</a></p>
 </div>
</section>

<section id="app" hidden>
 <div id="tabs"></div>
 <div id="v"></div>
</section>
</main>

<script>
const sb=supabase.createClient('https://tankluguqjxntfvcsktk.supabase.co','sb_publishable_h2aQ-_qGmciidA4ZUupTdw_mXWziHwn');
const $=s=>document.querySelector(s),rp=n=>'Rp'+Number(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={MENUNGGU_BAYAR:'Menunggu bayar',MENUNGGU_VERIFIKASI:'Menunggu verifikasi',DIPROSES:'Diproses',SELESAI:'Selesai',DIBATALKAN:'Dibatalkan',PEMBAYARAN_DITOLAK:'Pembayaran ditolak'};
const SV={coin:'Coin',diamond:'Diamond',event:'Event',livetier:'Live Tier',clans:'Clans Point',dreampoint:'Dream Point',seasonpass:'Season Pass',dreamdraft:'Dream Draft'};
let P={},me=null,tab='order',svc='coin',reg=false,flt='';

function msg(t,ok){const m=$('#msg');m.textContent=t||'';m.className=ok?'ok':'err';m.style.display=t?'block':'none'}
function mode(){reg=!reg;$('#ttl').textContent=reg?'Daftar':'Masuk';$('#go').textContent=reg?'Daftar':'Masuk';$('#sw').textContent=reg?'Sudah punya akun? Masuk':'Belum punya akun? Daftar';msg('')}

async function auth(){
 const raw=$('#u').value.trim().toLowerCase(),p=$('#p').value,isAdmin=raw=='admin';
 const w=raw.replace(/\D/g,'').replace(/^0/,'62');
 if(reg&&isAdmin)return msg('Nomor WhatsApp tidak valid');
 if(!isAdmin&&!/^62\d{8,13}$/.test(w))return msg('Nomor WhatsApp tidak valid (contoh 08123456789)');
 if(p.length<6)return msg('Password minimal 6 karakter');
 const email=isAdmin?'admin@hanzzz.app':'haniffadmuh154+'+w+'@gmail.com';let r;
 if(reg)r=await sb.auth.signUp({email,password:p,options:{data:{username:w,whatsapp:w}}});
 else r=await sb.auth.signInWithPassword({email,password:p});
 if(r.error){const e=r.error.message;return msg(/already|registered/i.test(e)?'Nomor ini sudah terdaftar, silakan masuk':/Invalid login/i.test(e)?'Nomor atau password salah':e)}
 init();
}
async function out(){await sb.auth.signOut();location.reload()}

async function init(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session){$('#auth').hidden=false;$('#app').hidden=true;return}
 const{data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 const{data:pr}=await sb.from('prices').select('service_id,key,price');P={};(pr||[]).forEach(r=>P[r.service_id+'.'+r.key]=r.price);
 me=data;$('#auth').hidden=true;$('#app').hidden=false;msg('');render();
}

function render(){
 const t=[['order','Pesan'],['mine','Order Saya']];if(me.is_admin)t.push(['admin','Admin'],['harga','Harga']);
 $('#tabs').innerHTML=t.map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join('')+'<button onclick="out()">Keluar</button>';
 $('#who').textContent=me.username;msg('');
 ({order:form,mine:mine,admin:admin,harga:priceEditor})[tab]();
}

/* ---------- FORM ORDER ---------- */
const F={
coin:'<label>Bonus Stadion (1-52)</label><input id="f1" type="number" min="1" max="52" value="1"><label>Jumlah koin (dalam K, 1 = 1.000 koin)</label><input id="f2" type="number" min="1" value="10">',
diamond:'<label>Jumlah diamond</label><input id="f1" type="number" min="1" value="100">',
event:'<label>Rentang tier</label><select id="f1"><option value="20-16">Tier 20 → 16</option><option value="15-11">Tier 15 → 11</option><option value="10-6">Tier 10 → 6</option><option value="5-1">Tier 5 → 1</option><option value="special">Event pemain spesial (semua tier)</option></select>',
livetier:'<label>Tier sekarang (1-20)</label><input id="f1" type="number" min="1" max="20" value="20"><label>Tier tujuan (1-20)</label><input id="f2" type="number" min="1" max="20" value="15">',
clans:'<label>Paket</label><select id="f1"><option value="30k">30.000 CP</option><option value="350k">350.000 CP</option></select><label>Jumlah paket</label><input id="f2" type="number" min="1" max="50" value="1">',
dreampoint:'<label>Jumlah (tiap 1 = 10K DP)</label><input id="f1" type="number" min="1" max="100" value="1">',
seasonpass:'<label>Jumlah XP (kelipatan 500)</label><input id="f1" type="number" min="500" step="500" value="500">',
dreamdraft:'<p class="m">Dream Draft, tanpa pilihan tambahan.</p>'};

function det(){
 if(svc=='coin')return{stadium:+$('#f1').value,amount_k:+$('#f2').value};
 if(svc=='diamond')return{amount:+$('#f1').value};
 if(svc=='event')return{range:$('#f1').value};
 if(svc=='clans')return{package:$('#f1').value,qty:+$('#f2').value};
 if(svc=='dreampoint')return{amount_10k:+$('#f1').value};
 if(svc=='seasonpass')return{xp:+$('#f1').value};
 if(svc=='dreamdraft')return{};
 return{from_tier:+$('#f1').value,to_tier:+$('#f2').value};
}
function calc(s,d){ // estimasi dari harga database; harga resmi dihitung server
 const g=k=>P[s+'.'+k]||0;let t=0;
 if(s=='coin')t=d.amount_k*g(d.stadium<=25?'rate_1_25':d.stadium<=39?'rate_26_39':'rate_40_52');
 else if(s=='diamond')t=d.amount*g(d.amount>=1000?'rate_bulk':'rate');
 else if(s=='event')t=g(d.range);
 else if(s=='clans')t=g(d.package)*d.qty;
 else if(s=='dreampoint')t=d.amount_10k*g('per_10k');
 else if(s=='seasonpass')t=Math.floor(d.xp/500)*g('per_500xp');
 else if(s=='dreamdraft')t=g('flat');
 else{const f=d.from_tier,o=d.to_tier;if(o<f)for(let i=o;i<f;i++)t+=g(i<=3?'rate_1_3':i<=8?'rate_4_8':i<=13?'rate_9_13':'rate_14_20');else t=(o-f)*g('rate_down')}
 return t||0;
}
function est(){try{$('#est').textContent=rp(calc(svc,det()))}catch(e){}}
function form(){
 $('#v').innerHTML=`<div class="card"><label>Layanan</label><select id="sv" onchange="svc=this.value;form()">${Object.entries(SV).map(([k,n])=>`<option value="${k}" ${svc==k?'selected':''}>${n}</option>`).join('')}</select>${F[svc]}
 <label>ID akun DLS (JANGAN tulis password di sini)</label><input id="gid">
 <p>Estimasi: <b id="est">Rp0</b><br><small class="m">Ditambah kode unik 1-999 saat order dibuat. Total resmi dihitung sistem.</small></p>
 <button class="pri" onclick="order()">Buat Order</button><p class="m" style="font-size:13px;margin-top:14px">Upgrade Stadion, Fasilitas, Rating, Pemain, dan Edit Logo: <a target="_blank" href="https://wa.me/6287777265953">konsultasi via WhatsApp</a>.</p></div>`;
 $('#v').querySelectorAll('input,select').forEach(e=>e.oninput=est);est();
}
async function order(){
 const{error}=await sb.rpc('create_order',{p_service:svc,p_details:det(),p_game_id:$('#gid').value});
 if(error)return msg(error.message);
 tab='mine';render();msg('Order dibuat! Silakan bayar lewat QRIS di bawah.',true);
}

/* ---------- ORDER SAYA ---------- */
function detTxt(o){return Object.entries(o.details).map(([k,v])=>`${esc(k)}: ${esc(v)}`).join(', ')}
async function mine(){
 const{data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});
 if(error)return msg(error.message);
 $('#v').innerHTML=data.length?data.map(o=>{
  const can=(o.status=='MENUNGGU_BAYAR'||o.status=='PEMBAYARAN_DITOLAK')&&new Date(o.expires_at)>new Date();
  return`<div class="card"><b>${esc(o.code)}</b> <span class="b s-${o.status}">${ST[o.status]}</span>
  <p>${SV[o.service_id]} — ${detTxt(o)}<br><span class="m">Akun: ${esc(o.game_account_id)}</span><br>Total: <b>${rp(o.total)}</b></p>
  ${o.status=='PEMBAYARAN_DITOLAK'&&o.admin_note?`<p class="m">Catatan admin: ${esc(o.admin_note)}</p>`:''}
  ${can?`<img class="qr" src="qris.jpeg" alt="QRIS">
  <p>Transfer <b>TEPAT ${rp(o.total)}</b> (termasuk kode unik ${o.unique_code}) lewat QRIS, lalu isi ID transaksi DANA.<br><small class="m">Bayar sebelum ${new Date(o.expires_at).toLocaleString('id-ID')}</small></p>
  <label>ID transaksi DANA</label><input id="r${o.id}">
  <button class="pri" onclick="pay('${o.id}')">Kirim ID Pembayaran</button>
  <button onclick="cnl('${o.id}')">Batalkan order</button>`:''}
  ${o.status=='MENUNGGU_VERIFIKASI'?'<p class="m">Pembayaranmu sedang dicek admin.</p>':''}
  ${o.status=='DIPROSES'?'<p class="m">Pembayaran terverifikasi. Admin akan menghubungi lewat WhatsApp.</p>':''}
  </div>`}).join(''):'<p class="m">Belum ada order.</p>';
}
async function pay(id){const{error}=await sb.rpc('submit_payment',{p_order_id:id,p_ref:$('#r'+id).value});if(error)return alert(error.message);mine();msg('ID pembayaran terkirim. Tunggu verifikasi admin.',true)}
async function cnl(id){if(!confirm('Batalkan order ini?'))return;const{error}=await sb.rpc('cancel_my_order',{p_order_id:id});if(error)alert(error.message);mine()}

/* ---------- ADMIN ---------- */
async function admin(){
 let q=sb.from('orders').select('*,profiles(username,whatsapp)').order('created_at',{ascending:false}).limit(100);
 if(flt)q=q.eq('status',flt);
 const{data,error}=await q;if(error)return msg(error.message);
 $('#v').innerHTML=`<select onchange="flt=this.value;admin()"><option value="">Semua status</option>${Object.entries(ST).map(([k,n])=>`<option value="${k}" ${flt==k?'selected':''}>${n}</option>`).join('')}</select><br><br>`+
 data.map(o=>{const w=o.profiles?.whatsapp,s=o.status;return`<div class="card"><b>${esc(o.code)}</b> <span class="b s-${s}">${ST[s]}</span>
 <p>${esc(o.profiles?.username)} · ${w?`<a target="_blank" href="https://wa.me/${esc(w)}">${esc(w)}</a>`:'-'}<br>${SV[o.service_id]} — ${detTxt(o)}<br>Akun DLS: <b>${esc(o.game_account_id)}</b><br>Total: <b>${rp(o.total)}</b> <span class="m">(kode unik ${o.unique_code})</span><br>ID DANA: <b>${esc(o.payment_ref||'-')}</b></p>
 ${s=='MENUNGGU_VERIFIKASI'?`<button class="pri" style="width:auto" onclick="act('${o.id}','verify')">Verifikasi</button><button onclick="act('${o.id}','reject')">Tolak</button>`:''}
 ${s=='DIPROSES'?`<button class="pri" style="width:auto" onclick="act('${o.id}','complete')">Selesai</button>`:''}
 ${['MENUNGGU_BAYAR','MENUNGGU_VERIFIKASI','DIPROSES','PEMBAYARAN_DITOLAK'].includes(s)?`<button onclick="act('${o.id}','cancel')">Batalkan</button>`:''}</div>`}).join('')||'<p class="m">Tidak ada order.</p>';
}
async function act(id,a){
 let n=null;if(a=='reject'||a=='cancel'){n=prompt('Catatan / alasan (opsional)');if(n===null)return}
 else if(a=='verify'&&!confirm('Pastikan ID dan nominal sudah cocok di mutasi DANA. Verifikasi?'))return;
 const{error}=await sb.rpc('admin_update_order',{p_order_id:id,p_action:a,p_note:n});
 if(error)alert(error.message);admin();
}

async function priceEditor(){
 const{data,error}=await sb.from('prices').select('*').order('service_id').order('sort');
 if(error)return msg(error.message);
 $('#v').innerHTML='<div class="card"><h3>Edit Harga</h3><p class="m">Ubah angka lalu klik Simpan. Berlaku langsung untuk order baru.</p>'+data.map(r=>`<label>${esc(SV[r.service_id])} — ${esc(r.label)} ${esc(r.unit)}</label><div style="display:flex;gap:8px"><input type="number" min="1" id="p_${r.service_id}_${r.key}" value="${r.price}"><button onclick="savePrice('${r.service_id}','${r.key}')">Simpan</button></div>`).join('')+'</div>';
}
async function savePrice(s,k){
 const v=+$('#p_'+s+'_'+k).value;if(!(v>0))return msg('Harga tidak valid');
 const{data,error}=await sb.from('prices').update({price:v}).eq('service_id',s).eq('key',k).select();
 if(error)return msg(error.message);
 if(!data.length)return msg('Gagal menyimpan (bukan admin?)');
 P[s+'.'+k]=v;msg('Harga tersimpan.',true);
}

init();
</script>
</body>
</html>
